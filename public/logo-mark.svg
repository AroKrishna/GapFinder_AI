<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="gf-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gf-spark" x1="10" y1="4" x2="14" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#gf-grad)" />
  
  <!-- Left knowledge node -->
  <circle cx="7" cy="14" r="1.75" fill="#ffffff" />
  
  <!-- Right knowledge node -->
  <circle cx="17" cy="14" r="1.75" fill="#ffffff" />
  
  <!-- Knowledge gap bridge arc connecting nodes -->
  <path d="M 7 14 C 7 18, 17 18, 17 14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />
  
  <!-- Vertical bridge pulse rising from the center of the gap -->
  <path d="M 12 16.5 V 13" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
  
  <!-- AI Breakthrough / Discovery star at the focal point -->
  <path d="M 12 5.5 L 13.1 8.2 L 16 9 L 13.1 9.8 L 12 12.5 L 10.9 9.8 L 8 9 L 10.9 8.2 Z" fill="url(#gf-spark)" />
</svg>
